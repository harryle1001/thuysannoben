name: Giám sát website

on:
  schedule:
    - cron: '17 * * * *' # mỗi giờ, phút 17
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra 10 URL và form (dry-run)
        id: mon
        continue-on-error: true
        run: |
          node scripts/monitor.js --base https://thuysannoben.com --report report.md || {
            sleep 60
            echo "Thử lại sau 60 giây"
            node scripts/monitor.js --base https://thuysannoben.com --report report.md
          }
      - name: Mở hoặc cập nhật Issue khi lỗi, đóng khi đã ổn
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.mon.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const title = '🚨 Website thuysannoben.com đang lỗi';
            const label = 'giam-sat';
            const report = fs.existsSync('report.md') ? fs.readFileSync('report.md', 'utf8') : 'Không chạy được kiểm tra.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 10 });
            const issue = open.find((i) => i.title === title);
            if (process.env.FAILED === 'true') {
              const body = `${report}\n\n[Xem lần chạy](${run})`;
              if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              else {
                try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' }); } catch {}
                await github.rest.issues.create({ ...context.repo, title, labels: [label], body: `Kiểm tra tự động phát hiện lỗi. Issue này tự đóng khi website ổn trở lại.\n\n${body}` });
              }
              core.setFailed('Website có lỗi');
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `✅ Website đã hoạt động bình thường.\n\n${report}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
