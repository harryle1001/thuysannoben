<g id="ten-san-pham" inkscape:groupmode="layer" inkscape:label="ten-san-pham" data-khung="4 36.29 82 29.42">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="1.8" fill="#9a5a00" text-anchor="middle" letter-spacing="0.22"><tspan x="45" y="40.48">THỨC ĂN BỔ SUNG</tspan></text>
<text font-family="'Playfair Display ExtraBold', 'Playfair Display', serif" font-weight="800" font-size="8.74" fill="#0b2347" text-anchor="middle"><tspan x="45" y="53.31">AMINOVIT</tspan></text>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.16" fill="#9a5a00" text-anchor="middle"><tspan x="45" y="59.6">Tăng trọng nhanh, giảm lượng thức ăn hằng ngày</tspan></text>
</g>
<g id="cong-dung" inkscape:groupmode="layer" inkscape:label="cong-dung" data-khung="4 65.72 82 37.74">
<line x1="4" y1="63.3" x2="86" y2="63.3" stroke="#0b2347" stroke-opacity="0.15" stroke-width="0.2"/>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.25" fill="#9a5a00"><tspan x="4" y="68.36">CÔNG DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="72.47">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="72.47">Bổ sung đầy đủ các loại acid amin, vitamin và khoáng chất cần thiết cho sự</tspan><tspan x="5.69" y="75.28">sinh trưởng và phát triển của tôm.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="79.22">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="79.22">Giúp tăng trọng nhanh, lột xác nhanh đúng chu kỳ, nhanh lớn.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="83.17">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="83.17">Khắc phục nhanh tình trạng ốp thân, mềm vỏ, vỏ xanh da trời.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="87.11">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="87.11">Giảm 10 -15% lượng thức ăn, giảm chi phí đầu tư, tăng lợi nhuận.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="91.05">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="91.05">Hòa với nước ấm rồi trộn đều lên thức ăn và cho ăn với liều như sau:</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="94.99">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="94.99">Đối với tôm dưới 45 ngày: Trộn 5g/ kg thức ăn, cho ăn ngày 2 lần.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="98.93">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="98.93">Đối với tôm trên 45 ngày: Trộn 10g/kg thức ăn, cho ăn 1 - 2 lần/ ngày.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#9a5a00" x="4" y="102.88">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="102.88">Chú ý: Tôm bị đường ruột nên hạn chế cho ăn sản phẩm này.</tspan></text>
</g>
