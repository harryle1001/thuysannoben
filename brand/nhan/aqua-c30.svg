<g id="ten-san-pham" inkscape:groupmode="layer" inkscape:label="ten-san-pham" data-khung="4.82 44.36 100.36 39.39">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.2" fill="#9a5a00" text-anchor="middle" letter-spacing="0.26"><tspan x="55" y="49.48">THỨC ĂN BỔ SUNG</tspan></text>
<text font-family="'Playfair Display ExtraBold', 'Playfair Display', serif" font-weight="800" font-size="10.68" fill="#0b2347" text-anchor="middle"><tspan x="55" y="65.15">AQUA C30%</tspan></text>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.64" fill="#9a5a00" text-anchor="middle"><tspan x="55" y="72.85">Bổ sung vitamin hằng ngày cho tôm, phòng ngừa cong thân, chống sốc,</tspan><tspan x="55" y="76.28">giảm stress</tspan></text>
</g>
<g id="cong-dung" inkscape:groupmode="layer" inkscape:label="cong-dung" data-khung="4.82 83.75 47.28 39.2">
<line x1="4.82" y1="80.79" x2="105.18" y2="80.79" stroke="#0b2347" stroke-opacity="0.15" stroke-width="0.2"/>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.75" fill="#9a5a00"><tspan x="4.82" y="86.98">CÔNG DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="4.82" y="92.01">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="6.89" y="92.01">Bổ sung VitaminC, methionine vào</tspan><tspan x="6.89" y="95.44">thức ăn hằng ngày cho tôm giúp</tspan><tspan x="6.89" y="98.87">tăng sức đề kháng, chống sốc,</tspan><tspan x="6.89" y="102.31">giảm stress cho tôm.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="4.82" y="107.12">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="6.89" y="107.12">Chống sốc tức thời khi tôm bị sốc</tspan><tspan x="6.89" y="110.56">do thay đổi thời tiết, tôm mới lột</tspan><tspan x="6.89" y="113.99">vỏ, tôm bị nổi đầu.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="4.82" y="118.81">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="6.89" y="118.81">Hỗ trợ phòng ngừa các bệnh cong</tspan><tspan x="6.89" y="122.24">thân, co cơ do thời tiết thay đổi.</tspan></text>
</g>
<g id="huong-dan" inkscape:groupmode="layer" inkscape:label="huong-dan" data-khung="57.9 83.75 47.28 44.02">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.75" fill="#9a5a00"><tspan x="57.9" y="86.98">HƯỚNG DẪN SỬ DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="57.9" y="92.01">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="59.97" y="92.01">Trộn 5g/kg thức ăn, trộn 2 - 3</tspan><tspan x="59.97" y="95.44">lần/ngày và suốt vụ nuôi</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="57.9" y="100.26">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="59.97" y="100.26">Khi thời tiết thay đổi, môi trường</tspan><tspan x="59.97" y="103.69">ao nuôi bị biến động: Trộn 10g/kg</tspan><tspan x="59.97" y="107.12">thức ăn.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="57.9" y="111.94">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="59.97" y="111.94">Hòa tan với nước sạch một lượng</tspan><tspan x="59.97" y="115.37">vừa đủ rồi trộn đều lên thức ăn, để</tspan><tspan x="59.97" y="118.81">yên 15 phút cho ráo rồi cho tôm ăn.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#9a5a00" x="57.9" y="123.62">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.64" fill="#13213a"><tspan x="59.97" y="123.62">Lưu ý: Có thể tạt trực tiếp xuống</tspan><tspan x="59.97" y="127.06">ao với liều 1kg/1.500m³ nước.</tspan></text>
</g>
