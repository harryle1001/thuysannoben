<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.97" fill="#b4232c" text-anchor="middle"><tspan x="55" y="82.92">Hỗ trợ tiêu hóa, hỗ trợ phòng ngừa các bệnh đường ruột, trống</tspan><tspan x="55" y="86.78">đường ruột cho tôm</tspan></text>
