<g id="cong-dung" inkscape:groupmode="layer" inkscape:label="cong-dung" data-khung="4.82 102.51 36.25 30.43">
<line x1="4.82" y1="99.72" x2="105.18" y2="99.72" stroke="#0b2347" stroke-opacity="0.15" stroke-width="0.2"/>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.58" fill="#b4232c"><tspan x="4.82" y="105.54">CÔNG DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#b4232c" x="4.82" y="110.28">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#13213a"><tspan x="6.76" y="110.28">Hỗ trợ tiêu hóa và hấp thu</tspan><tspan x="6.76" y="113.51">thức ăn nhanh chóng.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#b4232c" x="4.82" y="118.04">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#13213a"><tspan x="6.76" y="118.04">Hỗ trợ ngăn ngừa bệnh</tspan><tspan x="6.76" y="121.27">đường ruột, phân trắng,</tspan><tspan x="6.76" y="124.5">trống đường ruột</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#b4232c" x="4.82" y="129.03">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#13213a"><tspan x="6.76" y="129.03">Hỗ trợ làm to đường ruột,</tspan><tspan x="6.76" y="132.26">tăng trọng nhanh.</tspan></text>
</g>
<g id="huong-dan" inkscape:groupmode="layer" inkscape:label="huong-dan" data-khung="46.53 102.51 58.65 30.43">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.58" fill="#b4232c"><tspan x="46.53" y="105.54">HƯỚNG DẪN SỬ DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#b4232c" x="46.53" y="110.28">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#13213a"><tspan x="48.48" y="110.28">Bổ sung vào thức ăn hàng ngày: Trộn 5g/kg</tspan><tspan x="48.48" y="113.51">thưc ăn, cho ăn 2- 3 lần/ngày và suốt vụ nuôi.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#b4232c" x="46.53" y="118.04">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#13213a"><tspan x="48.48" y="118.04">Khi có dấu hiệu bệnh phân trắng, phân lỏng,</tspan><tspan x="48.48" y="121.27">phân đứt khúc: Trộn 10 - 15g/kg thức ăn, cho</tspan><tspan x="48.48" y="124.5">ăn 2- 3 lần/ngày.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#b4232c" x="46.53" y="129.03">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.48" fill="#13213a"><tspan x="48.48" y="129.03">Hòa tan với nước sạch rồi trộn đều lên thức ăn,</tspan><tspan x="48.48" y="132.26">để yên 15 phút rồi cho tôm ăn.</tspan></text>
</g>
