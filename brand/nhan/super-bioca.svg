<g id="ten-san-pham" inkscape:groupmode="layer" inkscape:label="ten-san-pham" data-khung="4 36.29 82 29.42">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="1.8" fill="#1f7a4d" text-anchor="middle" letter-spacing="0.22"><tspan x="45" y="40.48">CHẾ PHẨM SINH HỌC</tspan></text>
<text font-family="'Playfair Display ExtraBold', 'Playfair Display', serif" font-weight="800" font-size="8.74" fill="#0b2347" text-anchor="middle"><tspan x="45" y="53.31">SUPER BIOCA</tspan></text>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.16" fill="#1f7a4d" text-anchor="middle"><tspan x="45" y="59.6">Hấp thụ khí độc, cấp cứu khi tôm nổi đầu, làm sạch môi trường</tspan></text>
</g>
<g id="cong-dung" inkscape:groupmode="layer" inkscape:label="cong-dung" data-khung="4 65.72 29.51 29.27">
<line x1="4" y1="63.3" x2="86" y2="63.3" stroke="#0b2347" stroke-opacity="0.15" stroke-width="0.2"/>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.25" fill="#1f7a4d"><tspan x="4" y="68.36">CÔNG DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="4" y="72.47">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="72.47">Hấp thụ nhanh các loại khí</tspan><tspan x="5.69" y="75.28">đôc, cấp cứu khi tôm nổi</tspan><tspan x="5.69" y="78.09">đầu.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="4" y="82.03">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="82.03">Phân hủy và đào thải</tspan><tspan x="5.69" y="84.84">nhanh các khí độc ra khỏi</tspan><tspan x="5.69" y="87.65">môi trường ao nuôi.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="4" y="91.59">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="5.69" y="91.59">Cải thiện nhanh tình trạng</tspan><tspan x="5.69" y="94.4">ô nhiễm môi trường.</tspan></text>
</g>
<g id="huong-dan" inkscape:groupmode="layer" inkscape:label="huong-dan" data-khung="38.26 65.72 47.74 36.02">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.25" fill="#1f7a4d"><tspan x="38.26" y="68.36">HƯỚNG DẪN SỬ DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="38.26" y="72.47">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="39.95" y="72.47">Sử dụng định kỳ: Dùng 1 lít/ 5.000m³ nước,</tspan><tspan x="39.95" y="75.28">định kỳ 7 ngày/lần</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="38.26" y="79.22">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="39.95" y="79.22">Sử dụng khi trường hợp khí độc cao: Dùng 1</tspan><tspan x="39.95" y="82.03">lít/ 3.000m³ nước.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="38.26" y="85.97">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="39.95" y="85.97">Hòa với nước sạch ao nuôi một lượng vừa</tspan><tspan x="39.95" y="88.78">đủ rồi tạt đều khắp ao vào lúc sáng sớm</tspan><tspan x="39.95" y="91.59">hoặc chiều mát, mở quạt nước để Super</tspan><tspan x="39.95" y="94.4">BIOCA phân tán đều khắp ao.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#1f7a4d" x="38.26" y="98.34">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.16" fill="#13213a"><tspan x="39.95" y="98.34">Xin xem thêm hướng dẫn sử dụng ghi trên</tspan><tspan x="39.95" y="101.15">bao bì nhãn mác.</tspan></text>
</g>
