<g id="ten-san-pham" inkscape:groupmode="layer" inkscape:label="ten-san-pham" data-khung="4 36.29 82 27.78">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="1.8" fill="#1f7a4d" text-anchor="middle" letter-spacing="0.22"><tspan x="45" y="40.03">CHẾ PHẨM SINH HỌC</tspan></text>
<text font-family="'Playfair Display ExtraBold', 'Playfair Display', serif" font-weight="800" font-size="8.74" fill="#0b2347" text-anchor="middle"><tspan x="45" y="52.86">SUPER DIN 600</tspan></text>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.16" fill="#1f7a4d" text-anchor="middle"><tspan x="45" y="59.15">Siêu diệt khuẩn, diệt ngay vi khuẩn, khuẩn xanh, nấm, nsđv</tspan></text>
</g>
<g id="cong-dung" inkscape:groupmode="layer" inkscape:label="cong-dung" data-khung="4 64.07 39.14 20.74">
<line x1="4" y1="62.17" x2="86" y2="62.17" stroke="#0b2347" stroke-opacity="0.15" stroke-width="0.2"/>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="1.76" fill="#1f7a4d"><tspan x="4" y="66.14">CÔNG DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="4" y="69.37">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="5.33" y="69.37">Diệt khuẩn, nấm, nguyên sinh động vật... gây</tspan><tspan x="5.33" y="71.57">hại cho tôm.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="4" y="74.66">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="5.33" y="74.66">Tiêu diệt ngay các loại khuẩn xanh, nấm</tspan><tspan x="5.33" y="76.86">mốc... gây bệnh gan tụy, phân trắng trên tôm.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="4" y="79.95">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="5.33" y="79.95">Diệt khuẩn mạnh mẽ, an toàn, hiệu quả, không</tspan><tspan x="5.33" y="82.15">gây ảnh hưởng đến tảo, môi trường, đối tượng</tspan><tspan x="5.33" y="84.35">nuôi và người sử dụng.</tspan></text>
</g>
<g id="huong-dan" inkscape:groupmode="layer" inkscape:label="huong-dan" data-khung="46.86 64.07 39.14 44.99">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="1.76" fill="#1f7a4d"><tspan x="46.86" y="66.14">HƯỚNG DẪN SỬ DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="69.37">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="69.37">TRƯỚC KHI THẢ GIỐNG:</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="72.46">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="72.46">Dùng trước khi thả giống 2 - 3 ngày: Dùng 1</tspan><tspan x="48.19" y="74.66">lít/2.000m³ nước.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="77.75">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="77.75">DÙNG TRONG QUÁ TRÌNH NUÔI:</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="80.84">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="80.84">Sử dụng diệt khuẩn định kỳ: Dùng 1 lít/</tspan><tspan x="48.19" y="83.04">5.000m³ nước, định kỳ 5 - 7 ngày/lần.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="86.13">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="86.13">Sử dụng khi có dấu hiệu dịch bệnh xảy ra:</tspan><tspan x="48.19" y="88.33">Dùng 1 lít/3.000m³ nước, dùng liên tục 2 ngày.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="91.42">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="91.42">Hòa với nước sạch ao nuôi một lượng vừa đủ</tspan><tspan x="48.19" y="93.62">rồi tạt đều khắp ao, mở máy quạt nước hoặc</tspan><tspan x="48.19" y="95.82">sục khí để tăng hiệu quả của sản phẩm.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="98.91">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="98.91">Vì sản phẩm dễ bị mất hoạt lực khi chịu tác</tspan><tspan x="48.19" y="101.11">dụng của ánh nắng mặt trời, nên lưu ý sử dụng</tspan><tspan x="48.19" y="103.31">sản phẩm vào lúc chiều mát là tốt nhất.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="46.86" y="106.4">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="48.19" y="106.4">Lưu ý: Tùy theo tình trạng sức khỏe tôm để</tspan><tspan x="48.19" y="108.6">tăng hoặc giảm liều lượng cho thích hợp</tspan></text>
</g>
<g id="thanh-phan" inkscape:groupmode="layer" inkscape:label="thanh-phan" data-khung="4 86.67 39.14 5.75">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="1.76" fill="#1f7a4d"><tspan x="4" y="88.74">THÀNH PHẦN</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#1f7a4d" x="4" y="91.97">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.69" fill="#13213a"><tspan x="5.33" y="91.97">Iodin complex 27%</tspan></text>
</g>
<g id="phap-ly" inkscape:groupmode="layer" inkscape:label="phap-ly" data-khung="4 114.3 82 27.32">
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.66" fill="#13213a"><tspan x="4" y="117.17">Bảo quản: Nơi khô ráo, thoáng mát, tránh ánh nắng trực tiếp.</tspan></text>
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.66" fill="#13213a"><tspan x="4" y="120.16">Số ĐK/MSLH: [ĐIỀN] · KL tịnh: [ĐIỀN]</tspan></text>
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="1.66" fill="#13213a"><tspan x="4" y="123.15">NSX: [ĐIỀN] · HSD: [ĐIỀN]</tspan></text>
