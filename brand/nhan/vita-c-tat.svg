<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.6" fill="#0e6c8a" text-anchor="middle" letter-spacing="0.31"><tspan x="65" y="58.21">KHOÁNG CHẤT</tspan></text>
<text font-family="'Playfair Display ExtraBold', 'Playfair Display', serif" font-weight="800" font-size="12.62" fill="#0b2347" text-anchor="middle"><tspan x="65" y="76.73">VITA C TAT NEW</tspan></text>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="3.12" fill="#0e6c8a" text-anchor="middle"><tspan x="65" y="85.83">Vitaminc tạt xuống ao, chống sốc giảm stress cho tôm, cá</tspan></text>
</g>
<g id="cong-dung" inkscape:groupmode="layer" inkscape:label="cong-dung" data-khung="5.69 93.96 56.17 27.48">
<line x1="5.69" y1="90.77" x2="124.31" y2="90.77" stroke="#0b2347" stroke-opacity="0.15" stroke-width="0.2"/>
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.96" fill="#0e6c8a"><tspan x="5.69" y="97.45">CÔNG DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="5.69" y="102.87">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="7.92" y="102.87">Bổ sung vitamin tổng hợp cho tôm, cá</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="5.69" y="108.07">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="7.92" y="108.07">Hỗ trợ giảm stress, giảm sốc, khi môi</tspan><tspan x="7.92" y="111.77">trường thay đổi</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="5.69" y="116.97">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="7.92" y="116.97">Hỗ trợ tăng cường sức đề kháng giúp</tspan><tspan x="7.92" y="120.67">tôm cá khỏe mạnh, phát triển tốt</tspan></text>
</g>
<g id="huong-dan" inkscape:groupmode="layer" inkscape:label="huong-dan" data-khung="68.13 93.96 56.17 51.18">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.96" fill="#0e6c8a"><tspan x="68.13" y="97.45">HƯỚNG DẪN SỬ DỤNG</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="68.13" y="102.87">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="70.36" y="102.87">Sử dụng khi thời tiết thay đổi: Dùng</tspan><tspan x="70.36" y="106.57">5kg/3.000m³ nước, tạt vào lúc sáng</tspan><tspan x="70.36" y="110.28">sớm hoặc chiều mát.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="68.13" y="115.47">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="70.36" y="115.47">Sử dụng khi bị stress: Dùng</tspan><tspan x="70.36" y="119.17">5kg/2.000m³ nước.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="68.13" y="124.37">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="70.36" y="124.37">Hòa tan với nước ao nuôi một lượng</tspan><tspan x="70.36" y="128.07">vừa đủ rồi tạt đều khắp ao. Mở máy</tspan><tspan x="70.36" y="131.77">sục khí hoặc quạt nước để sản phẩm</tspan><tspan x="70.36" y="135.48">phân tán đều.</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="68.13" y="140.67">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="70.36" y="140.67">Thời hạn sử dụng: Sử dụng trong suốt</tspan><tspan x="70.36" y="144.38">quá trình nuôi.</tspan></text>
</g>
<g id="thanh-phan" inkscape:groupmode="layer" inkscape:label="thanh-phan" data-khung="5.69 124.57 56.17 23.77">
<text font-family="'Be Vietnam Pro SemiBold', 'Be Vietnam Pro', sans-serif" font-weight="600" font-size="2.96" fill="#0e6c8a"><tspan x="5.69" y="128.05">THÀNH PHẦN</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="5.69" y="133.48">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="7.92" y="133.48">L-Ascorbate-2-Monophosphate</tspan><tspan x="7.92" y="137.18">(vitamin C 35%) (min): 250 mg/kg</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="5.69" y="142.38">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="7.92" y="142.38">Vitamin B3 (min): 150 mg/kg</tspan></text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#0e6c8a" x="5.69" y="147.58">•</text><text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.85" fill="#13213a"><tspan x="7.92" y="147.58">Chất đệm Dextrose vừa đủ: 1 kg</tspan></text>
</g>
<g id="phap-ly" inkscape:groupmode="layer" inkscape:label="phap-ly" data-khung="5.69 162.12 118.61 42.53">
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.4" fill="#13213a"><tspan x="5.69" y="164.94">Bảo quản: Nơi khô, thoáng, tránh ánh nắng trực tiếp. Để xa tầm</tspan><tspan x="5.69" y="167.95">tay trẻ em.</tspan></text>
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.4" fill="#13213a"><tspan x="5.69" y="172.27">Số ĐK/MSLH: 02-037656 · KL tịnh:</tspan></text>
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.4" fill="#13213a"><tspan x="5.69" y="176.58">NSX:       · HSD:</tspan></text>
<text font-family="'Be Vietnam Pro', sans-serif" font-weight="400" font-size="2.4" fill="#13213a"><tspan x="5.69" y="180.9">Quy cách: 0,5 kg; 1 kg; 2 kg; 2,5 kg; 3 kg; 4 kg; 5 kg; 10 kg; 15 kg;</tspan><tspan x="5.69" y="183.91">20 kg; 25 kg</tspan></text>
